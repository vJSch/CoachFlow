<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoachFlow</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Ein unerwarteter Fehler ist aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Meldet Wechsel der Netzverbindung an Blazor (MainLayout.ConnectionChanged).
        window.coachflow = {
            watchConnection: function (ref) {
                window.addEventListener('online', function () { ref.invokeMethodAsync('ConnectionChanged', true); });
                window.addEventListener('offline', function () { ref.invokeMethodAsync('ConnectionChanged', false); });
            }
        };
    </script>
    <!-- Ohne Fingerprint-Platzhalter: Die API liefert index.html im Publish unverarbeitet aus. -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
